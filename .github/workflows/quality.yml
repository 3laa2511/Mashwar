name: Mashwar Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: mashwar-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, backend tests, and web preview build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-production fixture values for deterministic automated tests only.
    env:
      PRICING_HMAC_SECRET: test-only-pricing-secret-not-for-production
      PAYMOB_HMAC_SECRET: test-only-paymob-secret-not-for-production
      FAWRY_SECURITY_SECRET: test-only-fawry-secret-not-for-production
      VODAFONE_CASH_SECRET: test-only-vodafone-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run lint

      - name: Backend unit/logic tests
        run: bun run test:backend

      - name: Build developer preview
        run: bun run build

  customer-web:
    name: Customer web typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/customer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install repository dependencies from lockfile
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Typecheck customer web
        run: bun run typecheck

      - name: Build customer web
        run: bun run build

  flutter-client:
    name: Flutter client analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter_mashwar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter client
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
