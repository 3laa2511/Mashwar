name: Quality & Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-and-web:
    name: Backend & Web (Typecheck, Test, Build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mashwar_test
          POSTGRES_PASSWORD: mashwar_test
          POSTGRES_DB: mashwar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mashwar_test -d mashwar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (TypeScript)
        run: bun run typecheck

      - name: Execute backend security & integration tests
        run: bun run test

      - name: Execute migrations against disposable PostgreSQL
        env:
          DATABASE_URL: postgres://mashwar_test:mashwar_test@localhost:5432/mashwar_test
          NODE_ENV: test
        run: |
          bun -e 'import { verifyOrRunMigrations } from "./backend/src/database/migrator.ts"; const first = await verifyOrRunMigrations(true); if (first.mode !== "live_postgres") throw new Error("Expected live PostgreSQL execution"); console.log("First migration pass:", first.migrationsExecuted.join(", ")); const second = await verifyOrRunMigrations(true); if (second.mode !== "live_postgres") throw new Error("Expected live PostgreSQL execution on repeat"); console.log("Repeat migration pass:", second.migrationsExecuted.join(", "));'

      - name: Build web application
        run: bun run build

  flutter-app:
    name: Flutter Mobile Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Flutter project presence
        id: check_flutter
        run: |
          if [ -f "flutter_mashwar/pubspec.yaml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "flutter_mashwar project detected."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "flutter_mashwar project not found in this checkout."
          fi

      - name: Setup Flutter SDK
        if: steps.check_flutter.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install Flutter dependencies
        if: steps.check_flutter.outputs.present == 'true'
        run: |
          cd flutter_mashwar
          flutter pub get

      - name: Analyze Flutter codebase
        if: steps.check_flutter.outputs.present == 'true'
        run: |
          cd flutter_mashwar
          flutter analyze --no-fatal-infos

      - name: Run Flutter unit tests
        if: steps.check_flutter.outputs.present == 'true'
        run: |
          cd flutter_mashwar
          flutter test

      - name: Mobile checks status
        if: steps.check_flutter.outputs.present != 'true'
        run: echo "Flutter mobile app directory (flutter_mashwar) is not tracked in this checkout. Mobile checks completed as no-op."
