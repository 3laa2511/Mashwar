name: Quality & Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-and-web:
    name: Backend & Web (Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (TypeScript)
        run: bun run typecheck

      - name: Execute backend security & integration tests
        run: bun run test

      - name: Build web application
        run: bun run build

  flutter-app:
    name: Flutter Mobile Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Flutter directory presence
        id: check_flutter
        run: |
          if [ -d "flutter_mashwar" ]; then
            echo "has_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flutter=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter SDK
        if: steps.check_flutter.outputs.has_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        if: steps.check_flutter.outputs.has_flutter == 'true'
        working-directory: flutter_mashwar
        run: flutter pub get

      - name: Analyze Flutter codebase
        if: steps.check_flutter.outputs.has_flutter == 'true'
        working-directory: flutter_mashwar
        run: flutter analyze

      - name: Run Flutter unit tests
        if: steps.check_flutter.outputs.has_flutter == 'true'
        working-directory: flutter_mashwar
        run: flutter test
